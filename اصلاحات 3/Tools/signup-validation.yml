name: Signup and profile persistence validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze signup and profile data flow
        run: >
          flutter analyze --no-pub
          lib/screens/signup_screen.dart
          lib/screens/edit_profile_screen.dart
          lib/screens/member_profile_screen.dart
          lib/screens/widgets/step2_personal_details.dart
          lib/screens/edit_profile/widgets/step1_basic_physical_tab.dart
          lib/services/api_service.dart
          lib/models/member_profile_model.dart
          lib/screens/home/tabs/account_tab.dart
          lib/screens/my_interests_screen.dart
          lib/screens/my_profile_viewers_screen.dart
          lib/screens/chat_detail_screen.dart
          lib/screens/widgets/step1_basic_info.dart
          test/profile_edit_unit_test.dart
      - run: flutter test --no-pub

  laravel-php-syntax:
    name: Patch hosting archive and lint Laravel files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Patch baseline then prepare v3
        run: |
          python3 .github/scripts/patch_hosting_archive.py
          python3 .github/scripts/prepare_profile_fixes_v3.py
          unzip -tq "ملفات الاتسضافة.zip"
      - name: Lint exported PHP files
        shell: bash
        run: |
          set -euo pipefail
          test -d "اصلاحات 3/Laravel"
          grep -Fq "Route::get('/full-my-profile', 'ProfileController@get_full_my_profile');" "اصلاحات 3/Laravel/routes/api.php"
          grep -Fq "function get_full_my_profile" "اصلاحات 3/Laravel/app/Http/Controllers/Api/ProfileController.php"
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find "اصلاحات 3/Laravel" -type f -name '*.php' -print0)

  package-fixes:
    name: Commit اصلاحات 3
    needs: [flutter, laravel-php-syntax]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and verify package
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_hosting_archive.py
          python3 .github/scripts/prepare_profile_fixes_v3.py
          unzip -tq "ملفات الاتسضافة.zip"
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find "اصلاحات 3/Laravel" -type f -name '*.php' -print0)
          test -f "اصلاحات 3/README.md"
          test -f "اصلاحات 3/hosting-patch-manifest.json"
      - name: Commit package and hosting archive
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ملفات الاتسضافة.zip" "اصلاحات 3"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package signup and profile fixes in اصلاحات 3 [skip ci]"
          git push origin HEAD:main

  export-fixes-zip:
    name: Export اصلاحات 3 ZIP artifact
    needs: [package-fixes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build ZIP
        run: |
          test -f "اصلاحات 3/README.md"
          zip -qr "اصلاحات 3.zip" "اصلاحات 3"
      - uses: actions/upload-artifact@v4
        with:
          name: اصلاحات-3
          path: "اصلاحات 3.zip"
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

  export-fixes-v4:
    name: Export اصلاحات 4 ZIP artifact
    needs: [export-fixes-zip]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build and verify اصلاحات 4
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_fixes_v4.py
          test -f "اصلاحات 4/README.md"
          test -f "اصلاحات 4/hosting-patch-manifest.json"
          unzip -tq "اصلاحات 4.zip"
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find "اصلاحات 4/Laravel" -type f -name '*.php' -print0)
          host_tmp="$(mktemp -d)"
          unzip -q "اصلاحات 4/Hosting/ملفات الاتسضافة.zip" -d "$host_tmp"
          find "$host_tmp" -type f \( -path '*/app/Http/Controllers/Api/AuthController.php' -o -path '*/app/Http/Controllers/Api/Payment/StripeController.php' -o -path '*/app/Http/Controllers/Api/ProfileController.php' \) -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          stripe_file="$(find "$host_tmp" -type f -path '*/app/Http/Controllers/Api/Payment/StripeController.php' -print -quit)"
          auth_file="$(find "$host_tmp" -type f -path '*/app/Http/Controllers/Api/AuthController.php' -print -quit)"
          profile_file="$(find "$host_tmp" -type f -path '*/app/Http/Controllers/Api/ProfileController.php' -print -quit)"
          test -n "$stripe_file" && test -n "$auth_file" && test -n "$profile_file"
          ! grep -Fq '1265' "$stripe_file"
          grep -Fq 'confirm_payment_intent' "$stripe_file"
          grep -Fq '$autoVerify = true;' "$auth_file"
          grep -Fq 'remaining_profile_viewer_view' "$auth_file"
          grep -Fq 'firstOrNew' "$profile_file"
          grep -Fq 'remaining_profile_viewer_view - 1' "$profile_file"
          grep -Fq 'if ($isNewVisit)' "$profile_file"
      - uses: actions/upload-artifact@v4
        with:
          name: اصلاحات-4
          path: "اصلاحات 4.zip"
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
