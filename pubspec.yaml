name: hello_lawyer
version: 1.2.5+29
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.2
  get: 4.6.6
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.2.0
  firebase_storage: ^13.0.0
  firebase_database: ^12.0.0
  firebase_messaging: ^16.0.0
  google_sign_in: ^6.2.1
  flutter_signin_button: ^2.0.0
  flutter_easyloading: ^3.0.5
  fluttertoast: ^8.0.9
  google_fonts: ^6.3.2
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  string_validator: ^0.3.0
  path_provider: ^2.0.11
  path: ^1.8.0
  flutter_dotenv: ^5.0.2
  cached_network_image: ^3.3.0
  date_picker_timeline: ^1.2.3
  flutter_stripe: ^11.5.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.3.1
  http: ^1.1.0
  flutter_form_builder: ^9.1.0
  form_builder_validators: ^9.0.0
  package_info_plus: ^8.0.0
  file_picker: ^10.2.0
  uuid: ^3.0.6
  mime: ^1.0.2
  flutter_chat_ui:
    git:
      url: https://github.com/amsyary/flutter_chat_ui.git
  timezone: ^0.10.1
  jiffy: ^5.0.0
  permission_handler: ^11.3.1
  flutter_callkit_incoming: ^2.5.2
  json_serializable: ^6.2.0
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.1
  image_cropper: ^11.0.0
  sign_in_with_apple: ^7.0.1
  currency_text_input_formatter: ^2.2.3
  get_storage: ^2.1.1
  table_calendar: ^3.0.8
  dropdown_search: ^5.0.6
  date_count_down: ^2.1.0
  flutter_local_notifications: ^19.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  hmssdk_flutter: ^1.11.0
  image_picker: ^1.2.0
  flutter_image_compress: ^2.3.0
  showcaseview: ^5.0.1
  razorpay_flutter: ^1.4.0
  flutterwave_standard: ^1.0.4
  share_plus: ^12.0.1
  youtube_player_flutter: ^9.1.3
  intl: ^0.19.0
  audioplayers: ^5.2.1
  wakelock_plus: ^1.3.1
  # 🟢 الحزم الضرورية لنظام المحادثة والملفات:
  dio: ^5.4.3
  open_filex: ^4.4.0
  gal: ^2.3.2
  device_info_plus: ^10.1.0
  firebase_app_check: ^0.4.3
  custom_text: ^2.0.4
  # 🟢 حزم استخراج وطباعة ملفات الـ PDF:
  pdf: ^3.11.1
  printing: ^5.12.0

dev_dependencies:
  # integration_test:
  #   sdk: flutter
  flutter_lints: ^2.0.0
  lints: 2.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  patrol: ^3.3.0

dependency_overrides:
  intl: 0.19.0
  lottie: 3.1.2

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/ 
    - shorebird.yaml
  
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          weight: 400
          style: italic

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/hello_lawyer_logo.png"
  remove_alpha_ios: true