name: wesal_app
description: "A new Flutter project for Wesal Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # مكتبة الاتصال بالسيرفر لإرسال واستقبال بيانات الـ API
  http: ^1.2.0

  # مكتبة حفظ الجلسة والتوكن محلياً على الهاتف
  shared_preferences: ^2.2.2

  # أيقونات النظام
  cupertino_icons: ^1.0.8

  # مكتبات Firebase للإشعارات الفورية
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.0

  # مكتبة تسجيل الدخول الآمن بواسطة Google
  google_sign_in: ^6.2.1

  # مكتبة إظهار الإشعارات المحلية المنبثقة أعلى الشاشة
  flutter_local_notifications: ^17.1.2

  # مكتبة اختيار الصور والكاميرا
  image_picker: ^1.1.2

  # مكتبة اقتصاص الصور وتحديد الأبعاد
  image_cropper: ^8.0.2

  # مكتبة التخزين المؤقت للصور وعرضها بسلاسة من السيرفر
  cached_network_image: ^3.3.1

  # مكتبة فتح الروابط الخارجية والتخزين الآمن
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2

  # المكتبة الرسمية لعرض نافذة الدفع المباشرة والأصلية (Stripe Native Payment Sheet)
  flutter_stripe: ^11.2.0

  # مكتبة المشاركة الخارجية عبر تطبيقات الجوال
  share_plus: ^10.1.2

  # مكتبة التقاط الروابط العميقة (App Links & Dynamic Links)
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true