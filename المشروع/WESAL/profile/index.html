<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وصال - بطاقة العضو</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #01579B, #0288D1, #4FC3F7);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 36px 24px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        h2 {
            margin-top: 0;
            color: #4FC3F7;
            font-size: 24px;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #0288D1, #00B0FF);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 22px;
            box-shadow: 0 4px 15px rgba(2, 136, 209, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.6);
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>تطبيق وصال للزواج 💍</h2>
        <p>جاري فتح بطاقة العضو داخل التطبيق تلقائياً...</p>
        <p style="font-size: 13px; color: #94a3b8;">إذا لم يفتح التطبيق تلقائياً، يمكنك تنزيله وتثبيته مباشرة عبر الزر أدناه:</p>
        
        <!-- رابط تحميل ملف الـ APK المباشر المرفوع على سيرفرك -->
        <a id="downloadBtn" href="https://www.wesalsyria.com/downloads/wesal.apk" class="btn">
            📥 تحميل تطبيق وصال (APK)
        </a>
    </div>

    <script>
        // 1. قراءة معرف العضو من الرابط (id)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('id');

        if (userId) {
            // 2. محاولة فتح التطبيق المثبت عبر المخطط المخصص المباشر
            const customAppUri = `wesal://profile?id=${userId}`;
            const androidIntentUri = `intent://www.wesalsyria.com/profile?id=${userId}#Intent;scheme=https;package=com.wesalsyria.twa;end`;

            // توجيه المتصفح لفتح التطبيق
            window.location.href = customAppUri;

            // كخيار احتياطي ثانٍ للأندرويد
            setTimeout(function() {
                window.location.href = androidIntentUri;
            }, 500);
        }
    </script>
</body>
</html>
