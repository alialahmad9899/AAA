name: Signup and profile data integrity validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze all changed signup and profile files
        run: >
          flutter analyze --no-pub
          lib/screens/signup_screen.dart
          lib/screens/edit_profile_screen.dart
          lib/screens/partner_expectations_screen.dart
          lib/screens/widgets/step2_personal_details.dart
          lib/screens/edit_profile/widgets/step1_basic_physical_tab.dart
          lib/services/api_service.dart
          test/profile_edit_unit_test.dart

      - name: Run Flutter tests
        run: flutter test --no-pub

  laravel-php-syntax:
    name: Patch hosting archive and lint every changed PHP file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Patch Laravel source in hosting archive
        run: python3 .github/scripts/patch_hosting_archive.py

      - name: Verify archive integrity
        run: unzip -tq "ملفات الاتسضافة.zip"

      - name: Lint every exported Laravel PHP file
        shell: bash
        run: |
          set -euo pipefail
          test -d "اصلاحات 2/Laravel"
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find "اصلاحات 2/Laravel" -type f -name '*.php' -print0)

  package-fixes:
    name: Commit complete repaired source into اصلاحات 2
    needs: [flutter, laravel-php-syntax]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect and verify all repaired files
        shell: bash
        run: |
          set -euo pipefail

          python3 .github/scripts/patch_hosting_archive.py

          FIXES_DIR="اصلاحات 2"
          mkdir -p \
            "$FIXES_DIR/Flutter/lib/screens" \
            "$FIXES_DIR/Flutter/lib/screens/widgets" \
            "$FIXES_DIR/Flutter/lib/screens/edit_profile/widgets" \
            "$FIXES_DIR/Flutter/lib/services" \
            "$FIXES_DIR/Flutter/test" \
            "$FIXES_DIR/CI" \
            "$FIXES_DIR/Tools"

          cp lib/screens/signup_screen.dart "$FIXES_DIR/Flutter/lib/screens/"
          cp lib/screens/edit_profile_screen.dart "$FIXES_DIR/Flutter/lib/screens/"
          cp lib/screens/partner_expectations_screen.dart "$FIXES_DIR/Flutter/lib/screens/"
          cp lib/screens/widgets/step2_personal_details.dart "$FIXES_DIR/Flutter/lib/screens/widgets/"
          cp lib/screens/edit_profile/widgets/step1_basic_physical_tab.dart "$FIXES_DIR/Flutter/lib/screens/edit_profile/widgets/"
          cp lib/services/api_service.dart "$FIXES_DIR/Flutter/lib/services/"
          cp test/profile_edit_unit_test.dart "$FIXES_DIR/Flutter/test/"
          cp test/widget_test.dart "$FIXES_DIR/Flutter/test/"
          cp .github/workflows/signup-validation.yml "$FIXES_DIR/CI/"
          cp .github/scripts/patch_hosting_archive.py "$FIXES_DIR/Tools/"

          find "$FIXES_DIR/Laravel" -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
          unzip -tq "ملفات الاتسضافة.zip"

          cat > "$FIXES_DIR/README.md" <<'EOF'
          # اصلاحات 2 — إصلاحات التسجيل والملف الشخصي وربط بيانات العضو

          يحتوي هذا المجلد على الملفات النهائية المطابقة لما تم فحصه في CI.

          ## Flutter
          - `Flutter/lib/screens/signup_screen.dart` — تدفق التسجيل المرحلي، والتحقق من الحقول، وعدم تمرير تفضيلات العضو على أنها تفضيلات الشريك.
          - `Flutter/lib/screens/edit_profile_screen.dart` — تحميل البيانات ومعرّفات السجلات وتحديث الملف الشخصي والصورة.
          - `Flutter/lib/screens/partner_expectations_screen.dart` — تحميل وحفظ تفضيلات الشريك دون قيم افتراضية مختلقة.
          - `Flutter/lib/screens/widgets/step2_personal_details.dart` — حقول التعليم والعمل وسنوات البدء.
          - `Flutter/lib/screens/edit_profile/widgets/step1_basic_physical_tab.dart` — حقول تعديل التعليم والعمل وسنوات البدء.
          - `Flutter/lib/services/api_service.dart` — فك استجابات Laravel والتحقق الصارم من نجاح الكتابة وإرسال الحقول المقدمة فقط.
          - `Flutter/test/` — اختبارات استجابات الكتابة وموارد Laravel واختبار بناء التطبيق.

          ## Laravel — ملفات يمكن نسخها إلى المسارات النسبية نفسها داخل جذر Laravel
          - `Laravel/app/Http/Controllers/Api/AuthController.php`
          - `Laravel/app/Http/Controllers/Api/ProfileController.php`
          - `Laravel/app/Http/Controllers/Api/EducationController.php`
          - `Laravel/app/Http/Controllers/Api/CareerController.php`
          - `Laravel/app/Http/Requests/ProfileRequest.php`
          - `Laravel/app/Http/Requests/CareerRequest.php`
          - `Laravel/app/Http/Requests/PartnerExpectationRequest.php`
          - `Laravel/app/Http/Resources/PublicProfile/BasicInformation.php`
          - `Laravel/app/Http/Resources/PublicProfile/SpiritualSocialBackground.php`
          - `Laravel/app/Http/Resources/PublicProfile/PartnerExpectationResource.php`

          كما يحتوي جذر المستودع على أرشيف الاستضافة `ملفات الاتسضافة.zip` بعد تطبيق التعديلات نفسها.

          ## أدوات الفحص
          - `Tools/patch_hosting_archive.py` — يعيد تطبيق التعديلات على أرشيف الاستضافة مع فشل صريح عند عدم مطابقة المصدر.
          - `CI/signup-validation.yml` — تحليل Flutter والاختبارات وفحص PHP وسلامة الأرشيف.

          **مهم:** هذه الملفات مرفوعة على GitHub ومفحوصة بناءً على المصدر المتاح في الأرشيف. لا يعني ذلك أنها نُشرت تلقائياً على الاستضافة الحية أو أنها اختُبرت على قاعدة البيانات الحية. خذ نسخة احتياطية قبل استبدال أي ملف على الخادم ثم نفّذ اختبار تسجيل وتعديل فعلي.
          EOF

      - name: Commit repaired source and patched hosting archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ملفات الاتسضافة.zip" "اصلاحات 2"
          if [ -f ".github/workflows/export-hosting-source.yml" ]; then
            git rm ".github/workflows/export-hosting-source.yml"
          fi
          if git diff --cached --quiet; then
            echo "No new fixes to commit."
            exit 0
          fi
          git commit -m "Collect verified signup and profile fixes in اصلاحات 2 [skip ci]"
          git push origin HEAD:main
