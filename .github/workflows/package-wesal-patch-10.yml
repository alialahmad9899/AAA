name: Build Wesal patch 10

on:
  push:
    branches:
      - fix/wesal-profile-api-sync-2026-11-05

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build and verify patch ZIP
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "فلاتر/lib/services/api_service.dart"
            "فلاتر/lib/models/member_profile_model.dart"
            "فلاتر/lib/screens/home/tabs/account_tab.dart"
            "المشروع/WESAL/app/Http/Middleware/IsApiMember.php"
            "المشروع/WESAL/app/Http/Middleware/EmailVerifiedApi.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileController.php"
          )
          for file in "${files[@]}"; do
            test -s "$file"
          done
          archive="$RUNNER_TEMP/اصلاحات 10.zip"
          zip -q "$archive" "${files[@]}"
          test "$(unzip -Z1 "$archive" | wc -l | tr -d ' ')" = "6"
          unzip -t "$archive"
          unzip -Z1 "$archive"
          sha256sum "$archive"
      - name: Upload patch archive
        uses: actions/upload-artifact@v4
        with:
          name: wesal-patch-10
          path: ${{ runner.temp }}/اصلاحات 10.zip
          if-no-files-found: error
          retention-days: 7
