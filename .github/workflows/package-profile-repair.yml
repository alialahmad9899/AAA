name: Package profile editor repair

on:
  push:
    branches:
      - fix/public-profile-resource-subscription-model
    paths:
      - '.github/workflows/package-profile-repair.yml'
      - 'PROJECT_NOTES.md'
      - 'المشروع/WESAL/app/Http/Resources/Profile/OnBehalfResource.php'
      - 'المشروع/WESAL/app/Http/Resources/PublicProfile/BasicInformation.php'
      - 'المشروع/WESAL/app/Http/Resources/PublicProfile/PhysicalAttributes.php'
      - 'فلاتر/lib/models/member_profile_model.dart'
      - 'فلاتر/lib/screens/edit_profile_screen.dart'
      - 'فلاتر/lib/screens/signup_screen.dart'
      - 'فلاتر/test/profile_edit_unit_test.dart'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          php -l 'المشروع/WESAL/app/Http/Resources/Profile/OnBehalfResource.php'
          php -l 'المشروع/WESAL/app/Http/Resources/PublicProfile/BasicInformation.php'
          php -l 'المشروع/WESAL/app/Http/Resources/PublicProfile/PhysicalAttributes.php'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: فلاتر
        run: flutter pub get

      - name: Run profile edit regression tests
        working-directory: فلاتر
        run: flutter test test/profile_edit_unit_test.dart

      - name: Analyze Flutter code
        working-directory: فلاتر
        run: flutter analyze --no-pub

      - name: Build patch archive
        if: always()
        run: |
          mkdir -p dist
          zip -r 'dist/اصلاحات-تعديل-الملف-الشخصي.zip' \
            'PROJECT_NOTES.md' \
            'المشروع/WESAL/app/Http/Resources/Profile/OnBehalfResource.php' \
            'المشروع/WESAL/app/Http/Resources/PublicProfile/BasicInformation.php' \
            'المشروع/WESAL/app/Http/Resources/PublicProfile/PhysicalAttributes.php' \
            'فلاتر/lib/models/member_profile_model.dart' \
            'فلاتر/lib/screens/edit_profile_screen.dart' \
            'فلاتر/lib/screens/signup_screen.dart' \
            'فلاتر/test/profile_edit_unit_test.dart'

      - name: Upload patch archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: اصلاحات-تعديل-الملف-الشخصي
          path: dist/اصلاحات-تعديل-الملف-الشخصي.zip
          if-no-files-found: error
          retention-days: 7
