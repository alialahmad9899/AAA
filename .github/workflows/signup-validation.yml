name: Signup and project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

  laravel-php-syntax:
    name: Laravel signup PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint updated Laravel files from hosting archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="ملفات الاتسضافة.zip"
          test -f "$ZIP_FILE"

          AUTH_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Controllers/Api/AuthController.php$' | head -n 1)"
          REQUEST_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Requests/AuthRequest.php$' | head -n 1)"

          test -n "$AUTH_PATH"
          test -n "$REQUEST_PATH"

          unzip -p "$ZIP_FILE" "$AUTH_PATH" > "$RUNNER_TEMP/AuthController.php"
          unzip -p "$ZIP_FILE" "$REQUEST_PATH" > "$RUNNER_TEMP/AuthRequest.php"

          php -l "$RUNNER_TEMP/AuthController.php"
          php -l "$RUNNER_TEMP/AuthRequest.php"
