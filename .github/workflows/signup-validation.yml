name: Signup and project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub lib/screens/signup_screen.dart lib/services/api_service.dart test/profile_edit_unit_test.dart

      - name: Run Flutter tests
        run: flutter test --no-pub

  laravel-php-syntax:
    name: Laravel signup PHP syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint updated Laravel files from hosting archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="ملفات الاتسضافة.zip"
          test -f "$ZIP_FILE"

          AUTH_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Controllers/Api/AuthController.php$' | head -n 1)"
          REQUEST_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Requests/AuthRequest.php$' | head -n 1)"

          test -n "$AUTH_PATH"
          test -n "$REQUEST_PATH"

          unzip -p "$ZIP_FILE" "$AUTH_PATH" > "$RUNNER_TEMP/AuthController.php"
          unzip -p "$ZIP_FILE" "$REQUEST_PATH" > "$RUNNER_TEMP/AuthRequest.php"

          php -l "$RUNNER_TEMP/AuthController.php"
          php -l "$RUNNER_TEMP/AuthRequest.php"

  package-fixes:
    name: Collect repaired files in اصلاحات
    needs: [flutter, laravel-php-syntax]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect all repaired source files
        shell: bash
        run: |
          set -euo pipefail

          FIXES_DIR="اصلاحات"
          mkdir -p \
            "$FIXES_DIR/Flutter/lib/screens" \
            "$FIXES_DIR/Flutter/lib/services" \
            "$FIXES_DIR/Flutter/test" \
            "$FIXES_DIR/Laravel/app/Http/Controllers/Api" \
            "$FIXES_DIR/Laravel/app/Http/Requests" \
            "$FIXES_DIR/CI"

          cp lib/screens/signup_screen.dart "$FIXES_DIR/Flutter/lib/screens/"
          cp lib/services/api_service.dart "$FIXES_DIR/Flutter/lib/services/"
          cp test/profile_edit_unit_test.dart "$FIXES_DIR/Flutter/test/"
          cp test/widget_test.dart "$FIXES_DIR/Flutter/test/"
          cp .github/workflows/signup-validation.yml "$FIXES_DIR/CI/"

          ZIP_FILE="ملفات الاتسضافة.zip"
          AUTH_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Controllers/Api/AuthController.php | head -n 1)"
          REQUEST_PATH="$(unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)app/Http/Requests/AuthRequest.php | head -n 1)"
          test -n "$AUTH_PATH"
          test -n "$REQUEST_PATH"

          unzip -p "$ZIP_FILE" "$AUTH_PATH" > "$FIXES_DIR/Laravel/app/Http/Controllers/Api/AuthController.php"
          unzip -p "$ZIP_FILE" "$REQUEST_PATH" > "$FIXES_DIR/Laravel/app/Http/Requests/AuthRequest.php"

          cat > "$FIXES_DIR/README.md" <<'EOF'
          # ملفات الإصلاحات

          هذا المجلد يجمع نسخاً من جميع الملفات التي عُدّلت ضمن إصلاح عملية التسجيل في تطبيق وصال.

          ## Flutter
          - `Flutter/lib/screens/signup_screen.dart` — شاشة التسجيل والتحقق من نجاح حفظ المراحل.
          - `Flutter/lib/services/api_service.dart` — إرسال التسجيل والصورة والتحقق من استجابات API.
          - `Flutter/test/profile_edit_unit_test.dart` — اختبارات استجابات حفظ البيانات.
          - `Flutter/test/widget_test.dart` — اختبار بناء مسار التطبيق الفعلي.

          ## Laravel
          - `Laravel/app/Http/Controllers/Api/AuthController.php` — إنشاء المستخدم والعضوية والصورة وحالة التحقق ضمن معاملة واحدة.
          - `Laravel/app/Http/Requests/AuthRequest.php` — قواعد التحقق من الصورة وحجمها وامتداداتها.

          ## CI
          - `CI/signup-validation.yml` — إعدادات فحص PHP وتحليل Flutter والاختبارات.

          هذه نسخ مرجعية مجمعة؛ ملفات Flutter الأصلية تبقى في مساراتها التشغيلية تحت `lib/` و`test/`. وملفا Laravel مستخرجان من أرشيف الاستضافة المحدّث، ومسار نشرهما على الخادم يبقى منفصلاً.
          EOF

      - name: Commit organized fixes folder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "اصلاحات"
          if git diff --cached --quiet; then
            echo "The اصلاحات folder is already up to date."
            exit 0
          fi
          git commit -m "Collect repaired signup files in اصلاحات [skip ci]"
          git push origin HEAD:main
