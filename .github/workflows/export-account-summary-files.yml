name: Export account summary fix files
on:
  push:
    branches:
      - fix/public-profile-resource-subscription-model
    paths:
      - .github/workflows/export-account-summary-files.yml
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package only the account-card fix files
        run: |
          mkdir -p /tmp/wesal-fixes
          cp --parents 'المشروع/WESAL/app/Http/Controllers/Api/ProfileController.php' /tmp/wesal-fixes
          cp --parents 'المشروع/WESAL/routes/api.php' /tmp/wesal-fixes
          cp --parents 'فلاتر/lib/services/api_service.dart' /tmp/wesal-fixes
          cp --parents 'فلاتر/lib/models/member_profile_model.dart' /tmp/wesal-fixes
          cp --parents 'فلاتر/lib/screens/home/tabs/account_tab.dart' /tmp/wesal-fixes
          cp --parents 'فلاتر/test/profile_edit_unit_test.dart' /tmp/wesal-fixes
          cd /tmp/wesal-fixes
          zip -r "$GITHUB_WORKSPACE/WESAL-account-card-fixes.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: WESAL-account-card-fixes
          path: WESAL-account-card-fixes.zip
          if-no-files-found: error
          retention-days: 7
