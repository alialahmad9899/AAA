name: Build contact page patch archive

on:
  push:
    branches:
      - fix/site-contact-page-and-navigation-2026-11-06

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Package and verify website files
        shell: bash
        run: |
          set -euo pipefail
          zip -q -r WESAL_CONTACT_PAGE_PATCH.zip \
            "المشروع/WESAL/resources/views/frontend/contact_us.blade.php" \
            "المشروع/WESAL/resources/views/frontend/layouts/app.blade.php" \
            "المشروع/WESAL/resources/views/frontend/inc/header.blade.php" \
            "المشروع/WESAL/resources/views/frontend/index.blade.php"
          python - <<'PY'
          from zipfile import ZipFile
          expected = [
              "المشروع/WESAL/resources/views/frontend/contact_us.blade.php",
              "المشروع/WESAL/resources/views/frontend/layouts/app.blade.php",
              "المشروع/WESAL/resources/views/frontend/inc/header.blade.php",
              "المشروع/WESAL/resources/views/frontend/index.blade.php",
          ]
          with ZipFile("WESAL_CONTACT_PAGE_PATCH.zip") as archive:
              actual = archive.namelist()
              assert actual == expected, (actual, expected)
              assert archive.testzip() is None
          print("Verified exactly four original-path Blade files.")
          PY
      - name: Upload patch archive
        uses: actions/upload-artifact@v4
        with:
          name: WESAL_CONTACT_PAGE_PATCH_V2
          path: WESAL_CONTACT_PAGE_PATCH.zip
          if-no-files-found: error
          retention-days: 7
