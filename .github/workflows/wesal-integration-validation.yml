sage, '[package-profile-viewers-red-screen]') && '707c526f352bc2a672d34ad568ad22180d53f999' || contains(github.event.head_commit.message, '[package-express-interest-reliability]') && 'a8c479792c69c668b728785ebd2bdbdd7d8a042e' || contains(github.event.head_commit.message, '[package-security-hardening]') && 'b3154adf11bcb8827e7eb84f5146e3c85744fef1' || contains(github.event.head_commit.message, '[package-vip-catalog-ui]') && '8efc713070c9fd3d207f34515a1f9bb82b5764c5' || contains(github.event.head_commit.message, '[package-vip-services-fix]') && '91b36bc9fda0b8c805ae70647b2d7dae9f53e8f3' || contains(github.event.head_commit.message, '[package-premium-catalog-sync]') && 'e507ee4d0cc92124a8794e325e15f2f91c790bac' || contains(github.event.head_commit.message, '[package-vip-catalog-management]') && 'fab331a170f1d3d3bdb14dab7b1a389c7101ac79' || contains(github.event.head_commit.message, '[package-wesal-chat-messenger]') && '40cec01ac1aa45e07fc4039f2c1e869b3ba4ca43' || contains(github.event.head_commit.message, '[package-wesal-notifications-ui]') && '0945513f9f92602bd16b797e30c94131b2ac70bd' || contains(github.event.head_commit.message, '[package-wesal-ui-batch8]') && 'c7ee1ca8af66918c9c22d383eb3113e7fc64d25a' || contains(github.event.head_commit.message, '[package-wesal-ui-batch7]') && '468ec7c9705549bee157c4357de9a1ca54ce0245' || contains(github.event.head_commit.message, '[package-wesal-ui-batch6]') && '7e01be8eab2f54237c562750707c71cb0fb40642' || contains(github.event.head_commit.message, '[package-wesal-ui-batch5]') && '796842eedfe401b09e63daff592110769e42ac96' || contains(github.event.head_commit.message, '[package-wesal-ui-batch4]') && '1ba918c1c7845a3eb554e2ca49b4ce28e0570d33' || contains(github.event.head_commit.message, '[package-wesal-ui-batch3]') && '495eb5fc8ab28064390a294f688ee9d7c321c087' || contains(github.event.head_commit.message, '[package-wesal-ui-batch2]') && '519b445e7190df4338ff745a2c7b48dca9aeaf2f' || contains(github.event.head_commit.message, '[package-wesal-ui-batch1]') && '05fb514b9037a87d7cd2554d7216bb7bccc93c8e' || contains(github.event.head_commit.message, '[package-wesal-chats-search-subscriptions]') && 'f266d09b23718e79e98c72aecc08c6334dfc7efb' || contains(github.event.head_commit.message, '[package-wesal-redesign]') && 'a4126573d6e4f8f0252221de35a0bdd2fe17ed3d' || contains(github.event.head_commit.message, '[package-wesal-ui]') && 'e8fdd263b9060b8775b4a924261209d017b26c98' || contains(github.event.head_commit.message, '[package-wesal-notifications-reliability]') && 'f2fc35d93549b6cfe23e9a7bf741a82b318c1e5f' || contains(github.event.head_commit.message, '[package-wesal-notifications-invoice-token-fix]') && '6c266ef8485d13f0d95c8bd4a6f25571b0cf7988' || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/wesal-session-repair"
          mkdir -p "$package_dir"
          changed_list="$RUNNER_TEMP/wesal-session-files.txt"
          git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^(المشروع/WESAL/|فلاتر/|\.github/workflows/wesal-integration-validation\.yml$)' \
            | grep -Ev '(^|/)(AGENTS\.md|PROJECT_NOTES\.md|تعليمات العمل\.md)$' \
            > "$changed_list" || true

          copied=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$package_dir/$(dirname "$file")"
            cp -- "$file" "$package_dir/$file"
            copied=$((copied + 1))
          done < "$changed_list"

          if [ "$copied" -eq 0 ]; then
            echo "No runtime/source files changed in this commit; skipping the session ZIP."
            exit 0
          fi

          zip_path="$GITHUB_WORKSPACE/WESAL_SESSION_FIXES.zip"
          python3 - "$package_dir" "$zip_path" <<'PY'
          import os
          import sys
          import zipfile

          source_dir, archive_path = sys.argv[1:]
          with zipfile.ZipFile(
              archive_path,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
          ) as archive:
              for root, dirs, filenames in os.walk(source_dir):
                  dirs.sort()
                  for filename in sorted(filenames):
                      file_path = os.path.join(root, filename)
                      archive_name = os.path.relpath(
                          file_path, source_dir
                      ).replace(os.sep, "/")
                      archive.write(file_path, arcname=archive_name)
          PY
          unzip -tq "$zip_path"
          echo "Packaged $copied changed files."
          sha256sum "$zip_path"
          unzip -Z1 "$zip_path"

      - name: Upload session repair ZIP
        if: hashFiles('WESAL_SESSION_FIXES.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wesal-session-fixes
          path: WESAL_SESSION_FIXES.zip
          if-no-files-found: error
          retention-days: 30
