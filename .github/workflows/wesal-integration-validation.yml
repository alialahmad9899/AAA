name: Validate Wesal integration

on:
  push:
    branches:
      - integration/wesal-final-consolidated-2026-11-06
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate all changed Laravel PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git -c core.quotePath=false diff --name-only origin/main...HEAD -- 'المشروع/WESAL/**/*.php' 'المشروع/WESAL/*.php')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed PHP files to lint."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  flutter-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: فلاتر
        run: flutter pub get
      - name: Run all Flutter regression tests
        working-directory: فلاتر
        run: flutter test
