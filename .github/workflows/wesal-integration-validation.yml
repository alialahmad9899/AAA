name: Validate Wesal integration

on:
  push:
    branches:
      - integration/wesal-final-consolidated-2026-11-06
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate Laravel PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "المشروع/WESAL/app/Http/Controllers/Api/AuthController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/HomeController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/MemberController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileDropdownController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileViewerController.php"
            "المشروع/WESAL/app/Http/Controllers/CareerController.php"
            "المشروع/WESAL/app/Http/Controllers/EducationController.php"
            "المشروع/WESAL/app/Http/Middleware/EmailVerifiedApi.php"
            "المشروع/WESAL/app/Http/Middleware/IsApiMember.php"
            "المشروع/WESAL/app/Http/Requests/PartnerExpectationRequest.php"
            "المشروع/WESAL/app/Http/Resources/Profile/OnBehalfResource.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/AboutUser.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/BasicInformation.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/PhysicalAttributes.php"
            "المشروع/WESAL/app/Models/Astrology.php"
            "المشروع/WESAL/app/Models/Attitude.php"
            "المشروع/WESAL/app/Models/Hobby.php"
            "المشروع/WESAL/routes/api.php"
            "المشروع/WESAL/database/migrations/2026_11_05_000001_convert_attitudes_table_to_utf8mb4.php"
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done

  flutter-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: فلاتر
        run: flutter pub get
      - name: Run profile, signup and account model regression tests
        working-directory: فلاتر
        run: flutter test


  session-repair-zip:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Build and validate this session's ZIP
        id: package
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mapfile -d '' changed_files < <(git -c core.quotePath=false diff --name-only -z --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA")
          package_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              "المشروع/WESAL/"*|"فلاتر/"*|".github/workflows/"*) ;;
              *) continue ;;
            esac
            case "$file" in
              "AGENTS.md"|"PROJECT_NOTES.md"|"المشروع/تعليمات العمل.md"|"فلاتر/تعليمات العمل.md") continue ;;
            esac
            [[ -f "$file" ]] && package_files+=("$file")
          done
          if [[ ${#package_files[@]} -eq 0 ]]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No operational files changed in this session."
            exit 0
          fi
          mkdir -p dist
          zip -q -X dist/WESAL_SESSION_FIXES.zip "${package_files[@]}"
          unzip -t dist/WESAL_SESSION_FIXES.zip
          printf 'Packaged %s files from %s\n' "${#package_files[@]}" "$HEAD_SHA"
          printf '%s\n' "${package_files[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Upload session ZIP artifact
        if: steps.package.outputs.created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wesal-session-fixes
          path: dist/WESAL_SESSION_FIXES.zip
          if-no-files-found: error
          retention-days: 30
