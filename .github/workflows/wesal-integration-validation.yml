name: Validate Wesal integration

on:
  push:
    branches:
      - main
      - integration/wesal-final-consolidated-2026-11-06
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-php-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          tools: phpunit:10
      - name: Validate Laravel PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            "المشروع/WESAL/app/Http/Controllers/Api/AuthController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/HomeController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/MemberController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ChatController.php"
            "المشروع/WESAL/app/Services/ChatService.php"
            "المشروع/WESAL/app/Services/FirebaseNotificationService.php"
            "المشروع/WESAL/app/Http/Controllers/Api/NotificationController.php"
            "المشروع/WESAL/app/Http/Resources/ChatResource.php"
            "المشروع/WESAL/app/Http/Resources/ChatThreadResource.php"
            "المشروع/WESAL/app/Http/Resources/Chat/ChatViewResource.php"
            "المشروع/WESAL/app/Http/Controllers/Api/PackageController.php"
            "المشروع/WESAL/app/Http/Controllers/PackagePaymentController.php"
            "المشروع/WESAL/app/Http/Controllers/Admin/VipServiceAdminController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/SupportTicketController.php"
            "المشروع/WESAL/routes/api.php"
            "المشروع/WESAL/routes/admin.php"
            "المشروع/WESAL/app/Http/Controllers/Api/Payment/PaymentTypesController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/Payment/StripeController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/VipServiceApiController.php"
            "المشروع/WESAL/app/Utility/SubscriptionUtility.php"
            "المشروع/WESAL/routes/api.php"
            "المشروع/WESAL/app/Http/Resources/ActiveUserResource.php"
            "المشروع/WESAL/app/Services/SmartMatchingService.php"
            "المشروع/WESAL/tests/Unit/SmartMatchingServiceTest.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileDropdownController.php"
            "المشروع/WESAL/app/Http/Controllers/Api/ProfileViewerController.php"
            "المشروع/WESAL/app/Http/Controllers/CareerController.php"
            "المشروع/WESAL/app/Http/Controllers/EducationController.php"
            "المشروع/WESAL/app/Http/Middleware/EmailVerifiedApi.php"
            "المشروع/WESAL/app/Http/Middleware/IsApiMember.php"
            "المشروع/WESAL/app/Http/Requests/PartnerExpectationRequest.php"
            "المشروع/WESAL/app/Models/PartnerExpectation.php"
            "المشروع/WESAL/app/Http/Resources/Profile/OnBehalfResource.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/AboutUser.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/BasicInformation.php"
            "المشروع/WESAL/app/Http/Resources/PublicProfile/PhysicalAttributes.php"
            "المشروع/WESAL/app/Models/Astrology.php"
            "المشروع/WESAL/app/Models/Attitude.php"
            "المشروع/WESAL/app/Models/Hobby.php"
            "المشروع/WESAL/database/migrations/2026_11_05_000001_convert_attitudes_table_to_utf8mb4.php"
          )
          for file in "${files[@]}"; do
            php -l "$file"
          done
          (
            cd "المشروع/WESAL"
            phpunit --no-configuration tests/Unit/SmartMatchingServiceTest.php
          )

  flutter-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        working-directory: فلاتر
        run: flutter pub get
      - name: Analyze Dart sources without the LSP server
        working-directory: فلاتر
        run: dart analyze --fatal-infos
      - name: Run Flutter regression tests including chat timestamps and models
        working-directory: فلاتر
        run: flutter test

  session-repair-zip:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # Package creation is independent from test execution; both outcomes are reported separately.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repair source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Package only files changed in this repair session
        shell: bash
        env:
          BASE_SHA: ${{ contains(github.event.head_commit.message, '[package-wesal-chat-messenger]') && '40cec01ac1aa45e07fc4039f2c1e869b3ba4ca43' || contains(github.event.head_commit.message, '[package-wesal-notifications-ui]') && '0945513f9f92602bd16b797e30c94131b2ac70bd' || contains(github.event.head_commit.message, '[package-wesal-ui-batch8]') && 'c7ee1ca8af66918c9c22d383eb3113e7fc64d25a' || contains(github.event.head_commit.message, '[package-wesal-ui-batch7]') && '468ec7c9705549bee157c4357de9a1ca54ce0245' || contains(github.event.head_commit.message, '[package-wesal-ui-batch6]') && '7e01be8eab2f54237c562750707c71cb0fb40642' || contains(github.event.head_commit.message, '[package-wesal-ui-batch5]') && '796842eedfe401b09e63daff592110769e42ac96' || contains(github.event.head_commit.message, '[package-wesal-ui-batch4]') && '1ba918c1c7845a3eb554e2ca49b4ce28e0570d33' || contains(github.event.head_commit.message, '[package-wesal-ui-batch3]') && '495eb5fc8ab28064390a294f688ee9d7c321c087' || contains(github.event.head_commit.message, '[package-wesal-ui-batch2]') && '519b445e7190df4338ff745a2c7b48dca9aeaf2f' || contains(github.event.head_commit.message, '[package-wesal-ui-batch1]') && '05fb514b9037a87d7cd2554d7216bb7bccc93c8e' || contains(github.event.head_commit.message, '[package-wesal-chats-search-subscriptions]') && 'f266d09b23718e79e98c72aecc08c6334dfc7efb' || contains(github.event.head_commit.message, '[package-wesal-redesign]') && 'a4126573d6e4f8f0252221de35a0bdd2fe17ed3d' || contains(github.event.head_commit.message, '[package-wesal-ui]') && 'e8fdd263b9060b8775b4a924261209d017b26c98' || github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/wesal-session-repair"
          mkdir -p "$package_dir"
          changed_list="$RUNNER_TEMP/wesal-session-files.txt"
          git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^(المشروع/WESAL/|فلاتر/)' \
            | grep -Ev '(^|/)(AGENTS\.md|PROJECT_NOTES\.md|تعليمات العمل\.md)$' \
            > "$changed_list" || true

          copied=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$package_dir/$(dirname "$file")"
            cp -- "$file" "$package_dir/$file"
            copied=$((copied + 1))
          done < "$changed_list"

          if [ "$copied" -eq 0 ]; then
            echo "No runtime/source files changed in this commit; skipping the session ZIP."
            exit 0
          fi

          zip_path="$GITHUB_WORKSPACE/WESAL_SESSION_FIXES.zip"
          python3 - "$package_dir" "$zip_path" <<'PY'
          import os
          import sys
          import zipfile

          source_dir, archive_path = sys.argv[1:]
          with zipfile.ZipFile(
              archive_path,
              mode="w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=6,
          ) as archive:
              for root, dirs, filenames in os.walk(source_dir):
                  dirs.sort()
                  for filename in sorted(filenames):
                      file_path = os.path.join(root, filename)
                      archive_name = os.path.relpath(
                          file_path, source_dir
                      ).replace(os.sep, "/")
                      archive.write(file_path, arcname=archive_name)
          PY
          unzip -tq "$zip_path"
          echo "Packaged $copied changed files."
          sha256sum "$zip_path"
          unzip -Z1 "$zip_path"

      - name: Upload session repair ZIP
        if: hashFiles('WESAL_SESSION_FIXES.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wesal-session-fixes
          path: WESAL_SESSION_FIXES.zip
          if-no-files-found: error
          retention-days: 30
